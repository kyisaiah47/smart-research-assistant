<!DOCTYPE html>
<html>
<head>
    <title>Create Placeholder Icons</title>
</head>
<body>
    <canvas id="canvas" style="display: none;"></canvas>
    <div id="downloads"></div>
    
    <script>
        function createIcon(size, filename) {
            const canvas = document.getElementById('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#1a73e8';
            ctx.fillRect(0, 0, size, size);
            
            // White circle
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/3, 0, 2 * Math.PI);
            ctx.fill();
            
            // Brain symbol (simplified)
            ctx.fillStyle = '#1a73e8';
            ctx.font = `bold ${Math.floor(size * 0.4)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🧠', size/2, size/2);
            
            // Create download link
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.textContent = `Download ${filename}`;
                a.style.display = 'block';
                a.style.margin = '10px';
                document.getElementById('downloads').appendChild(a);
                a.click(); // Auto-download
            });
        }
        
        // Create all three icon sizes
        createIcon(16, 'icon16.png');
        setTimeout(() => createIcon(48, 'icon48.png'), 100);
        setTimeout(() => createIcon(128, 'icon128.png'), 200);
    </script>
</body>
</html>
