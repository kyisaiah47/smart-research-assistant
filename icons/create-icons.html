<!DOCTYPE html>
<html>
<head>
    <title>Generate Extension Icons</title>
</head>
<body>
    <canvas id="canvas16" width="16" height="16" style="border:1px solid #000; margin: 5px;"></canvas>
    <canvas id="canvas48" width="48" height="48" style="border:1px solid #000; margin: 5px;"></canvas>
    <canvas id="canvas128" width="128" height="128" style="border:1px solid #000; margin: 5px;"></canvas>

    <script>
        function createIcon(size) {
            const canvas = document.getElementById(`canvas${size}`);
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#1a73e8';
            ctx.fillRect(0, 0, size, size);
            
            // Brain icon
            ctx.fillStyle = 'white';
            ctx.font = `${Math.floor(size * 0.6)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🧠', size/2, size/2);
            
            // Download link
            const link = document.createElement('a');
            link.download = `icon${size}.png`;
            link.href = canvas.toDataURL();
            link.textContent = `Download ${size}x${size}`;
            link.style.display = 'block';
            link.style.margin = '5px';
            document.body.appendChild(link);
        }
        
        createIcon(16);
        createIcon(48);
        createIcon(128);
    </script>
</body>
</html>
