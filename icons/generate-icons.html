
<!DOCTYPE html>
<html>
<head>
    <title>Generate Icons</title>
</head>
<body>
    <h3>Right-click each canvas and "Save image as..." to save the icons</h3>
    
    <div>
        <p>icon16.png:</p>
        <canvas id="canvas16" width="16" height="16" style="border: 1px solid #ccc; image-rendering: pixelated;"></canvas>
    </div>
    
    <div>
        <p>icon48.png:</p>
        <canvas id="canvas48" width="48" height="48" style="border: 1px solid #ccc;"></canvas>
    </div>
    
    <div>
        <p>icon128.png:</p>
        <canvas id="canvas128" width="128" height="128" style="border: 1px solid #ccc;"></canvas>
    </div>

    <script>
        function drawIcon(canvas, size) {
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#1a73e8';
            ctx.fillRect(0, 0, size, size);
            
            // White circle background
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - 2, 0, 2 * Math.PI);
            ctx.fill();
            
            // Brain-like shape
            ctx.fillStyle = '#1a73e8';
            ctx.font = `${Math.floor(size * 0.5)}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // For smaller sizes, use simpler design
            if (size <= 16) {
                ctx.fillStyle = '#1a73e8';
                ctx.fillRect(0, 0, size, size);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(2, 2, size-4, size-4);
                ctx.fillStyle = '#1a73e8';
                ctx.fillRect(4, 4, size-8, size-8);
            } else {
                // Draw brain-like curves
                ctx.strokeStyle = '#1a73e8';
                ctx.lineWidth = Math.max(1, size/32);
                
                // Simplified brain outline
                ctx.beginPath();
                ctx.ellipse(size/2, size/2, size/3, size/4, 0, 0, 2 * Math.PI);
                ctx.stroke();
                
                // Add some internal lines
                ctx.beginPath();
                ctx.moveTo(size/2, size/4);
                ctx.lineTo(size/2, 3*size/4);
                ctx.stroke();
                
                // Add AI text for larger icons
                if (size >= 48) {
                    ctx.fillStyle = '#1a73e8';
                    ctx.font = `${Math.floor(size * 0.15)}px Arial`;
                    ctx.fillText('AI', size/2, size * 0.85);
                }
            }
        }
        
        // Generate all three sizes
        drawIcon(document.getElementById('canvas16'), 16);
        drawIcon(document.getElementById('canvas48'), 48);
        drawIcon(document.getElementById('canvas128'), 128);
    </script>
</body>
</html>
